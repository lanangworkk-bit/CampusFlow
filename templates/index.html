<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFlow</title>
    <meta name="description" content="Kelola tugas kuliah, mata kuliah, dan catatan dalam satu tempat.">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- ====================== LOGIN / REGISTER ====================== -->
<section id="auth" class="auth-wrap">
    <div class="auth-card">
        <h1 class="brand">Campus<span>Flow</span></h1>
        <p class="muted center">Kelola tugas kuliah tanpa ribet.</p>

        <div class="tabs">
            <button data-auth-tab="login" class="active">Masuk</button>
            <button data-auth-tab="register">Daftar</button>
        </div>

        <p id="authError" class="error-box" role="alert" aria-live="polite"></p>

        <div id="loginPanel">
            <form id="loginForm">
                <label for="loginUsername">Username atau email</label>
                <input id="loginUsername" name="username" autocomplete="username" required>

                <label for="loginPassword">Password</label>
                <input id="loginPassword" name="password" type="password"
                       autocomplete="current-password" required>

                <button class="btn-primary" type="submit">Masuk</button>
            </form>
            <p class="muted center small">
                Coba akun demo: <code>demo</code> / <code>demo1234</code>
            </p>
        </div>

        <div id="registerPanel" class="hidden">
            <form id="registerForm">
                <label for="regName">Nama lengkap</label>
                <input id="regName" name="full_name" autocomplete="name">

                <label for="regUsername">Username</label>
                <input id="regUsername" name="username" autocomplete="username" required
                       pattern="[a-zA-Z0-9_]{3,30}"
                       title="3-30 karakter: huruf, angka, underscore">

                <label for="regEmail">Email</label>
                <input id="regEmail" name="email" type="email" autocomplete="email" required>

                <label for="regPassword">Password (min. 8 karakter)</label>
                <input id="regPassword" name="password" type="password"
                       autocomplete="new-password" minlength="8" required>

                <button class="btn-primary" type="submit">Buat akun</button>
            </form>
        </div>
    </div>
</section>

<!-- ====================== APLIKASI ====================== -->
<div id="app" class="hidden">

    <header class="topbar">
        <h1 class="brand">Campus<span>Flow</span></h1>
        <div class="topbar-right">
            <span id="currentUser" class="muted"></span>
            <button id="themeToggle" class="btn-sm">Dark</button>
            <button id="logoutBtn" class="btn-sm">Keluar</button>
        </div>
    </header>

    <main class="container">

        <!-- Statistik -->
        <section class="panel">
            <h2>Ringkasan</h2>
            <div id="statsGrid" class="stats-grid"></div>
        </section>

        <!-- Insight -->
        <section class="panel" id="insightPanel"></section>

        <!-- Form task -->
        <section class="panel">
            <h2 id="taskFormTitle">Tambah Tugas</h2>
            <form id="taskForm">
                <div class="form-grid">
                    <div class="span-2">
                        <label for="taskTitle">Judul</label>
                        <input id="taskTitle" required maxlength="200">
                    </div>
                    <div class="span-2">
                        <label for="taskDescription">Deskripsi</label>
                        <textarea id="taskDescription" rows="2" maxlength="5000"></textarea>
                    </div>
                    <div>
                        <label for="taskDeadline">Tenggat</label>
                        <input id="taskDeadline" type="date">
                    </div>
                    <div>
                        <label for="taskPriority">Prioritas</label>
                        <select id="taskPriority">
                            <option value="LOW">Low</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="HIGH">High</option>
                            <option value="URGENT">Urgent</option>
                        </select>
                    </div>
                    <div class="span-2">
                        <label for="taskCourse">Mata kuliah</label>
                        <select id="taskCourse"></select>
                    </div>
                </div>
                <div class="form-actions">
                    <button id="taskSubmit" class="btn-primary" type="submit">Tambah</button>
                    <button id="taskCancel" class="btn-sm hidden" type="button">Batal</button>
                </div>
            </form>
        </section>

        <!-- Daftar task -->
        <section class="panel">
            <div class="panel-head">
                <h2>Daftar Tugas</h2>
                <select id="sortSelect" class="small">
                    <option value="deadline:asc">Tenggat (terdekat)</option>
                    <option value="deadline:desc">Tenggat (terlama)</option>
                    <option value="title:asc">Judul A-Z</option>
                    <option value="title:desc">Judul Z-A</option>
                    <option value="priority:asc">Prioritas</option>
                    <option value="status:asc">Status</option>
                    <option value="created_at:desc">Terbaru</option>
                </select>
            </div>

            <div class="toolbar">
                <input id="searchInput" type="search" placeholder="Cari tugas..." aria-label="Cari tugas">
                <select id="priorityFilter" aria-label="Filter prioritas">
                    <option value="">Semua prioritas</option>
                    <option value="URGENT">Urgent</option>
                    <option value="HIGH">High</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="LOW">Low</option>
                </select>
                <select id="courseFilter" aria-label="Filter mata kuliah">
                    <option value="">Semua mata kuliah</option>
                </select>
            </div>

            <div class="chips">
                <button data-filter="all" class="chip active">Semua</button>
                <button data-filter="TODO" class="chip">Belum</button>
                <button data-filter="IN PROGRESS" class="chip">Dikerjakan</button>
                <button data-filter="COMPLETED" class="chip">Selesai</button>
                <button data-filter="OVERDUE" class="chip">Terlambat</button>
            </div>

            <div id="taskList" class="list"></div>
            <div id="taskPagination" class="pagination"></div>
        </section>

        <!-- Mata kuliah -->
        <section class="panel">
            <div class="panel-head">
                <h2>Mata Kuliah</h2>
                <select id="courseSortSelect" class="small">
                    <option value="name:asc">Nama A-Z</option>
                    <option value="name:desc">Nama Z-A</option>
                    <option value="code:asc">Kode</option>
                    <option value="sks:desc">SKS tertinggi</option>
                </select>
            </div>
            <div id="courseList" class="course-grid"></div>
            <div id="coursePagination" class="pagination"></div>
        </section>

        <!-- Catatan -->
        <section class="panel">
            <h2>Catatan</h2>
            <form id="noteForm" class="note-form">
                <input id="noteInput" placeholder="Tulis catatan..." maxlength="5000" required>
                <button class="btn-primary" type="submit">Simpan</button>
            </form>
            <div id="noteList" class="note-grid"></div>
        </section>

    </main>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
