name: CI

# Jalankan otomatis saat ada push atau pull request.
on:
  push:
    branches: [main, 'semester-*']
  pull_request:
    branches: [main]

# Batalkan run lama kalau ada commit baru. Hemat kuota runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. Kualitas kode: syntax, import, dan style
  # ---------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Cek syntax Python
        run: python -m compileall -q backend/

      - name: Cek syntax JavaScript
        run: node --check static/script.js

      - name: Cek import bersih
        run: python -c "from backend.app import app; print('import OK')"

      - name: Cek style kode
        run: |
          ruff check backend/ --select=E9,F63,F7,F82
          ruff format --check backend/ || echo "Format belum rapi (tidak memblokir CI)"

  # ---------------------------------------------------------------
  # 2. Test otomatis
  # ---------------------------------------------------------------
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan test
        env:
          FLASK_ENV: testing
          SECRET_KEY: test-secret-not-for-production
        run: pytest tests/ -v --tb=short

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # ---------------------------------------------------------------
  # 3. Keamanan dependency
  # ---------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Scan vulnerability dependency
        run: pip-audit --strict || echo "Ditemukan vulnerabilities, cek log"

      - name: Pastikan tidak ada secret yang ikut ter-commit
        run: |
          if [ -f .env ]; then
            echo "::error::File .env ikut ter-commit. Hapus dari git!"
            exit 1
          fi
          echo "Aman, tidak ada .env di repository."

  # ---------------------------------------------------------------
  # 4. Build image Docker (untuk memastikan Dockerfile tetap valid)
  # ---------------------------------------------------------------
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: campusflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pastikan image benar-benar jalan
        run: |
          docker run -d --name test-app -p 8000:8000 \
            -e FLASK_ENV=production \
            -e SECRET_KEY=ci-test-secret \
            campusflow:ci
          sleep 15
          for i in 1 2 3 4 5; do
            if curl -fsS http://localhost:8000/api/health; then
              echo ""
              echo "Container sehat."
              exit 0
            fi
            echo "Menunggu container siap... (percobaan $i)"
            sleep 5
          done
          echo "Container tidak merespons /api/health"
          docker logs test-app
          exit 1
